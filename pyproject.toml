[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "retina-screen"
version = "0.1.0"
description = "Diabetic retinopathy grading: EyePACS pretraining, APTOS fine-tuning, IDRiD external test"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
