# Stage 1: pretrain on EyePACS 2015 (88k images, noisy labels).
# ~84k training images at 0.34 s per batch of 16 is ~30 min per epoch on a
# Kaggle T4, so 8 epochs is ~4.5 h including validation: one "Save & Run All"
# session (12 h limit). If a session is cut short, continue with
#   python scripts/train.py --config configs/pretrain_eyepacs.yaml --resume outputs/pretrain_eyepacs/last.pt
experiment:
  name: pretrain_eyepacs
  out_dir: outputs
data:
  manifest: cache/eyepacs.csv
  train_splits: [train]
  val_splits: [val]
preprocess:
  size: 512
  ben_graham: true
model:
  backbone: efficientnet_b3
  head: regression
  pretrained: true   # ImageNet
train:
  image_size: 512
  epochs: 8
  batch_size: 16
  lr: 1.0e-3
  backbone_lr_mult: 0.3
  warmup_epochs: 1
  freeze_epochs: 1
  sampler_power: 0.5   # EyePACS is ~73% grade 0
  num_workers: 4
